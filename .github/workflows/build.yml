name: Build and Push

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Zip the app
        run: |
          mkdir build
          cp app.py deploy.sh requirements.txt build/
          cd build
          zip -r dummy-app.zip .

      - name: Upload to JFrog Artifactory
        run: |
          curl -u ${{ secrets.JFROG_USER }}:${{ secrets.JFROG_API_KEY }} \
          -T build/dummy-app.zip \
          "https://yourcompany.jfrog.io/artifactory/dummy-repo/dummy-app.zip"
